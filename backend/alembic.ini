[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://toy_library:toy_library@postgres:5432/toy_library

# Separator used when splitting multi-path config values such as
# prepend_sys_path and version_locations. Without this set, Alembic
# emits a deprecation warning on every run. "os" uses os.pathsep.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
