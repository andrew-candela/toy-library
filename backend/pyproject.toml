[project]
name = "toy-library-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.0",
    "aioboto3>=13.0",
    "redis[hiredis]>=5.0",
    "structlog>=25.5.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "strawberry-graphql[fastapi]>=0.315.4",
    "resend[async]>=2.30.1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "openai>=2.44.0",
    "pgvector>=0.4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]  # Only include folders starting with 'app'
exclude = ["migrations*"]  # Explicitly ignore the migrations folder
