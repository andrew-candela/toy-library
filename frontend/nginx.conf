server {
    listen 80;
    server_name localhost;

    # Backstop for image uploads (client-side compression targets well under this).
    # Backend's own limit (MAX_TOY_IMAGE_BYTES) is 10MB; keep this below that.
    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://backend:8000; # Matches the service name and port in compose.yml

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /internal-images/ {
        internal;
        alias /data/images/;
        expires 30d;

        # 1. Standard caching
        add_header Cache-Control "public, max-age=2592000";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Type' always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Check for literal file, then directory, then fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Good practice for SPA assets
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
