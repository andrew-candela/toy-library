server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Check for literal file, then directory, then fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Good practice for SPA assets
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
