services:
  postgres:
    # image: postgres:18
    image: pgvector/pgvector:0.8.4-pg18-trixie
    pull_policy: if_not_present
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - toy-images-data:/data/images
    env_file:
      - ./backend/.env
    environment:
      TOY_IMAGE_STORAGE_DIR: /data/images
      TOY_IMAGE_PUBLIC_PATH: /images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first    # <--- CRUCIAL: Start the new container BEFORE stopping the old one
        failure_action: rollback
        delay: 5s
    stop_grace_period: 30s

  redis:
    image: redis:8
    pull_policy: if_not_present
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_IMAGE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  toy-images-data:
